server.port=8080
spring.data.mongodb.uri=mongodb://localhost:27017/emailassistant

# AI Integration Config
# Supported providers: gemini, openai
ai.provider=openai

# Google Gemini API
gemini.api.key=${GEMINI_API_KEY:${AI_API_KEY:default-key-please-set-me}}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent

# OpenAI API (using Groq's OpenAI-compatible endpoint with user key)
openai.api.key=${OPENAI_API_KEY:}
openai.api.url=https://api.groq.com/openai/v1/chat/completions
openai.model=llama-3.1-8b-instant
